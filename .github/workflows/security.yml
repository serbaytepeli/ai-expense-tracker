# Security pipeline (docs/architecture.md section 6.3, development-plan.md T0.5).
#
# Runs on every pull request (no workflow-level path filter, so "security-gate" always reports a
# result), on pushes to main, weekly, and on demand. Branch protection should require
# "security-gate" next to "ci-gate".
#
# The Docker image is scanned in ci.yml (backend job), where the image is built.

name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 03:17 UTC. Weekly, not daily, to stay within the Actions minutes of a private repo.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Scanner binaries: official GitHub releases, pinned by version and SHA-256 (verified before use).
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: pull requests scan their commit range, other events the whole history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            log_opts="${BASE_SHA}..${HEAD_SHA}"
            echo "Scanning the commits of this pull request: $log_opts"
          else
            log_opts="--all"
            echo "Scanning the full history"
          fi
          # Any finding fails the job. --redact keeps secret values out of the log.
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml \
            --log-opts="$log_opts" --exit-code 1 .

  trivy-deps:
    name: trivy-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy ${{ env.TRIVY_VERSION }}
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy

      # Lockfiles: backend/gradle.lockfile and mobile/package-lock.json (production dependencies).
      # Fails on HIGH/CRITICAL vulnerabilities that have a fix. Accepted findings: .trivyignore.
      - name: Scan dependency lockfiles (HIGH, CRITICAL)
        run: |
          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            .

  npm-audit:
    name: npm-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Reads package-lock.json only; no install needed.
      - name: Audit production dependencies (high and above fails)
        run: npm audit --omit=dev --audit-level=high

      - name: Report development dependencies (informational, never fails)
        if: always()
        run: |
          {
            echo "### npm audit (all dependencies, informational)"
            echo
            echo '```'
            npm audit --audit-level=none 2>&1 | tail -n 15 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scanner-self-test:
    name: scanner-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Gitleaks ${{ env.GITLEAKS_VERSION }} and Trivy ${{ env.TRIVY_VERSION }}
        run: |
          gl="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$gl" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gl}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$gl" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$gl" -C "$RUNNER_TEMP" gitleaks
          tv="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tv" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tv}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tv" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tv" -C "$RUNNER_TEMP" trivy

      # Plants a run-time generated fake secret and a vulnerable lockfile OUTSIDE the repository
      # and fails unless both scanners report them.
      - name: Prove the scanners detect planted findings
        run: scripts/ci/scanner-self-test.sh "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/trivy" .gitleaks.toml

  # The only security job branch protection needs to require.
  security-gate:
    name: security-gate
    if: always()
    needs: [gitleaks, trivy-deps, npm-audit, scanner-self-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### security-gate"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          # Every security check always runs, so anything other than success fails the gate.
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Security checks not successful: $bad"
            exit 1
          fi
          echo "All security checks succeeded."
