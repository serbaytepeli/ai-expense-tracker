# Base configuration. These defaults are the SAFE (production-like) settings:
# no Swagger, no health details, no stack traces, only the health endpoint exposed.
# The "dev" profile relaxes a few of them; the "prod" profile restates them explicitly.
#
# Secrets and connection settings come ONLY from environment variables (see .env.example).
# There are no defaults for DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET: the app does
# not start without them.

spring:
  application:
    name: ai-expense-tracker
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # Kubernetes liveness/readiness groups are not needed before deployment (D-11);
      # disabled so the response stays exactly {"status":"UP"} (docs/api-contract.md section 8).
      probes:
        enabled: false
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: logstash
    json:
      # Masks passwords, tokens and API keys in every log value (safety net).
      customizer: com.aiexpense.common.internal.SensitiveValueMaskingCustomizer
  level:
    root: INFO

app:
  jwt:
    secret: ${JWT_SECRET:}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:}
    daily-limit: ${AI_DAILY_LIMIT:5}
    reservation-ttl: ${AI_RESERVATION_TTL:2m}
    provider-timeout: ${AI_PROVIDER_TIMEOUT:20s}
